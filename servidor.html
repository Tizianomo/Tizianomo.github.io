/* =========================================================
   THRASHMC NETWORK — SERVER PAGE MEGA PRO
   ========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 50% -10%,rgba(142,81,255,.35),transparent 35%),
        radial-gradient(circle at 100% 35%,rgba(221,108,255,.14),transparent 30%),
        radial-gradient(circle at 0% 70%,rgba(142,81,255,.12),transparent 30%),
        #05030a;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-2;
    background-image:
        linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
    background-size:55px 55px;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;
    background:
        radial-gradient(circle at 50% 50%,transparent 30%,rgba(0,0,0,.45));
}

a{
    text-decoration:none;
    color:inherit;
}

button{
    font-family:inherit;
}


/* =========================================================
   NAVBAR
   ========================================================= */

.navbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:74px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 5.5%;

    background:rgba(5,3,10,.78);
    backdrop-filter:blur(20px);

    border-bottom:1px solid rgba(255,255,255,.07);

    z-index:1000;
}

.logo{
    font-size:23px;
    font-weight:1000;
    letter-spacing:1px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ddd6ff,
            #8e51ff,
            #dd6cff
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.menu{
    display:flex;
    align-items:center;
    gap:18px;
}

.menu a{
    color:#aaa3b1;
    font-size:11px;
    font-weight:800;
    transition:.25s;
}

.menu a:hover{
    color:#fff;
    transform:translateY(-1px);
}

.menu-active{
    color:#fff!important;
}

.menu-shop{
    padding:10px 16px;
    border-radius:9px;

    background:
        linear-gradient(
            135deg,
            #8e51ff,
            #dd6cff
        );

    color:#fff!important;

    box-shadow:
        0 8px 25px rgba(142,81,255,.22);
}


/* =========================================================
   HERO
   ========================================================= */

.hero{
    min-height:800px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:140px 20px 100px;

    position:relative;
    overflow:hidden;
}

.hero::before{
    content:"";

    position:absolute;

    width:700px;
    height:700px;

    left:50%;
    top:40%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(142,81,255,.18),
            transparent 65%
        );

    filter:blur(20px);

    pointer-events:none;
}

.hero-content{
    width:100%;
    max-width:1100px;

    position:relative;
    z-index:2;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:8px;

    padding:10px 18px;

    border-radius:999px;

    background:rgba(142,81,255,.09);

    border:1px solid rgba(221,108,255,.25);

    color:#ddd6ff;

    font-size:10px;
    font-weight:1000;

    letter-spacing:2px;

    margin-bottom:28px;

    box-shadow:
        0 0 35px rgba(142,81,255,.08);
}

.badge-dot{
    color:#5bea8d;
}

.hero h1{
    font-size:clamp(65px,13vw,150px);

    line-height:.85;

    font-weight:1000;

    letter-spacing:-8px;

    background:
        linear-gradient(
            90deg,
            #fff 0%,
            #ddd6ff 30%,
            #8e51ff 65%,
            #dd6cff 100%
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    text-shadow:
        0 0 100px rgba(142,81,255,.25);
}

.network{
    margin-top:22px;

    color:#c7c0ce;

    font-size:clamp(15px,3vw,25px);

    font-weight:900;

    letter-spacing:12px;
}

.hero-description{
    max-width:700px;

    margin:28px auto 0;

    color:#817987;

    font-size:15px;

    line-height:1.8;
}
