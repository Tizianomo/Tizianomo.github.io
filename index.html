<head>

<title>THRASHMC NETWORK | Minecraft</title>

<meta name="description" content="THRASHMC NETWORK - Servidor Minecraft FullPVP">

<style>

:root{
--bg:#05030a;
--bg2:#090611;
--card:rgba(18,12,27,.72);
--card2:#120b1b;
--purple:#8e51ff;
--pink:#dd6cff;
--light:#ddd6ff;
--white:#fff;
--muted:#93899e;
--border:rgba(255,255,255,.08);
--green:#5bea8d;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Inter,Arial,sans-serif;
background:
radial-gradient(circle at 15% 0%,rgba(142,81,255,.25),transparent 32%),
radial-gradient(circle at 85% 15%,rgba(221,108,255,.18),transparent 28%),
radial-gradient(circle at 50% 100%,rgba(142,81,255,.12),transparent 35%),
var(--bg);
color:white;
overflow-x:hidden;
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
z-index:-2;

background-image:
linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);

background-size:55px 55px;
}

body:after{
content:"";
position:fixed;
width:500px;
height:500px;
border-radius:50%;
background:rgba(142,81,255,.08);
filter:blur(100px);
top:25%;
left:50%;
transform:translateX(-50%);
pointer-events:none;
z-index:-1;
}

a{
color:inherit;
text-decoration:none;
}

button{

/* =========================
NAVBAR
========================= */

.navbar{
position:fixed;
top:0;
left:0;
right:0;
height:76px;
z-index:9999;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 6%;

background:rgba(5,3,10,.78);
backdrop-filter:blur(18px);

border-bottom:1px solid var(--border);
}

.logo{
font-size:21px;
font-weight:900;
letter-spacing:1px;

background:linear-gradient(
90deg,
#fff,
#ddd6ff,
#8e51ff,
#dd6cff
);

-webkit-background-clip:text;
background-clip:text;
color:transparent;

text-shadow:0 0 30px rgba(142,81,255,.25);
}

.nav{
display:flex;
align-items:center;
gap:6px;
}

.nav a{
font-size:13px;
font-weight:700;
color:#aaa2b2;

padding:11px 13px;
border-radius:8px;

transition:.25s;
}

.nav a:hover{
color:#fff;
background:rgba(142,81,255,.1);
}

.nav .shop-link{
background:linear-gradient(
135deg,
var(--purple),
var(--pink)
);

color:#fff;

box-shadow:0 8px 30px rgba(142,81,255,.2);
}

.menu-button{
display:none;

width:44px;
height:44px;

border:1px solid rgba(221,108,255,.25);
border-radius:10px;

background:rgba(255,255,255,.04);

color:white;

font-size:22px;
cursor:pointer;
}

@media(max-width:900px){

.menu-button{
display:block;
}

.nav{
display:none;

position:absolute;
top:76px;
left:0;
right:0;

padding:15px;

background:rgba(8,5,13,.97);
backdrop-filter:blur(20px);

border-bottom:1px solid var(--border);

flex-direction:column;
}

.nav.open{
display:flex;
}

.nav a{
width:100%;
text-align:center;
padding:15px;
}

}

.btn{
