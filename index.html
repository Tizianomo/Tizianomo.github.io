/* =====================================================
   FONDO
===================================================== */

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:-2;

    background:

    radial-gradient(
        circle at 20% 10%,
        rgba(142,81,255,.10),
        transparent 25%
    ),

    radial-gradient(
        circle at 80% 30%,
        rgba(255,255,255,.05),
        transparent 25%
    ),

    linear-gradient(
        180deg,
        #0b0d11 0%,
        #0e1117 45%,
        #090b0f 100%
    );
}

body::after{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:-1;

    opacity:.35;

    background-image:

    linear-gradient(
        rgba(255,255,255,.025) 1px,
        transparent 1px
    ),

    linear-gradient(
        90deg,
        rgba(255,255,255,.025) 1px,
        transparent 1px
    );

    background-size:60px 60px;
}
