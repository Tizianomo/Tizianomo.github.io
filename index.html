<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THRASHMC NETWORK | Minecraft</title>
<meta name="description" content="THRASHMC NETWORK - FullPVP Minecraft Network">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#07050b;
    color:white;
    overflow-x:hidden;
}

a{
    text-decoration:none;
    color:inherit;
}

button{
    font-family:inherit;
}

/* =========================
   FONDO
========================= */

body{
    background:
        radial-gradient(circle at 50% -10%,rgba(150,70,255,.35),transparent 35%),
        radial-gradient(circle at 0% 50%,rgba(220,80,255,.12),transparent 30%),
        radial-gradient(circle at 100% 80%,rgba(100,50,255,.12),transparent 30%),
        #07050b;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;
    opacity:.35;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:50px 50px;
}

/* =========================
   NAVBAR
========================= */

.navbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:76px;
    z-index:9999;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 6%;

    background:rgba(7,5,11,.82);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
    font-size:23px;
    font-weight:1000;
    letter-spacing:2px;

    background:linear-gradient(
        90deg,
        #ffffff,
        #ddd6ff,
        #9b5cff,
        #e16cff
    );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.desktop-menu{
    display:flex;
    align-items:center;
    gap:8px;
}

.desktop-menu a{
    padding:11px 13px;
    border-radius:9px;
    color:#aaa4b3;
    font-size:12px;
    font-weight:800;
    transition:.25s;
}

.desktop-menu a:hover{
    color:#fff;
    background:rgba(255,255,255,.06);
}

.desktop-menu .store{
    color:#fff;
    background:linear-gradient(135deg,#8e51ff,#dd6cff);
    box-shadow:0 8px 25px rgba(142,81,255,.25);
}

/* =========================
   TRES PUNTITOS
========================= */

.menu-button{
    display:none;

    width:44px;
    height:44px;

    border:1px solid rgba(255,255,255,.12);
    border-radius:11px;

    background:rgba(255,255,255,.05);
    color:white;

    cursor:pointer;
    font-size:24px;
}

.mobile-menu{
    position:absolute;
    top:84px;
    right:5%;

    width:230px;

    padding:10px;

    display:none;

    background:rgba(12,9,18,.97);
    border:1px solid rgba(221,108,255,.2);
    border-radius:16px;

    box-shadow:
        0 20px 70px rgba(0,0,0,.6),
        0 0 40px rgba(142,81,255,.12);
}

.mobile-menu.active{
    display:block;
}

.mobile-menu a{
    display:block;
    padding:14px 15px;
    border-radius:10px;

    color:#b5aebe;
    font-size:13px;
    font-weight:bold;

    transition:.2s;
}

.mobile-menu a:hover{
    color:#fff;
    background:rgba(142,81,255,.15);
}

.mobile-menu .mobile-store{
    margin-top:5px;
    color:white;
    text-align:center;
    background:linear-gradient(135deg,#8e51ff,#dd6cff);
}

/* =========================
   HERO
========================= */

.hero{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:130px 20px 80px;

    position:relative;
}

.hero:before{
    content:"";
    position:absolute;

    width:550px;
    height:550px;

    left:50%;
    top:45%;

    transform:translate(-50%,-50%);

    background:radial-gradient(
        circle,
        rgba(142,81,255,.18),
        transparent 70%
    );

    filter:blur(10px);
    pointer-events:none;
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:1000px;
}

.badge{
    display:inline-block;

    padding:10px 18px;

    border-radius:50px;

    border:1px solid rgba(221,108,255,.25);
    background:rgba(142,81,255,.09);

    color:#ddd6ff;

    font-size:10px;
    font-weight:900;
    letter-spacing:2px;

    margin-bottom:28px;
}

.hero h1{
    font-size:clamp(58px,13vw,145px);

    line-height:.85;

    font-weight:1000;

    letter-spacing:-8px;

    background:linear-gradient(
        90deg,
        #ffffff,
        #ddd6ff,
        #9b5cff,
        #e16cff
    );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    filter:drop-shadow(0 0 35px rgba(142,81,255,.22));
}

.network{
    margin-top:22px;

    font-size:clamp(15px,3vw,25px);

    letter-spacing:12px;

    color:#b9b1c1;

    font-weight:900;
}

.hero-description{
    max-width:680px;

    margin:28px auto;

    color:#89818f;

    font-size:15px;
    line-height:1.8;
}

.buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;

    margin-top:30px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    min-width:150px;

    padding:15px 23px;

    border-radius:11px;

    font-size:12px;
    font-weight:900;

    border:none;

    cursor:pointer;

    transition:.25s;
}

.btn:hover{
    transform:translateY(-4px);
}

.primary{
    color:white;

    background:linear-gradient(
        135deg,
        #8e51ff,
        #dd6cff
    );

    box-shadow:
        0 12px 35px rgba(142,81,255,.25);
}

.secondary{
    color:white;

    background:rgba(255,255,255,.04);

    border:1px solid rgba(255,255,255,.1);
}

/* =========================
   IP
========================= */

.ip-box{
    max-width:600px;

    margin:38px auto 0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;

    padding:16px;

    border-radius:15px;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,255,255,.08);

    box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.ip-label{
    color:#716a78;

    font-size:9px;
    font-weight:bold;
    letter-spacing:2px;
}

.ip{
    margin-top:5px;

    font-size:15px;
    font-weight:900;
}

.copy-btn{
    border:0;

    padding:12px 17px;

    border-radius:9px;

    background:#8e51ff;
    color:#fff;

    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

.copy-btn:hover{
    background:#a56cff;
    transform:scale(1.04);
}

/* =========================
   SECCIONES
========================= */

section{
    padding:110px 6%;
}

.section-title{
    max-width:750px;

    margin:0 auto 55px;

    text-align:center;
}

.label{
    color:#dd6cff;

    font-size:10px;
    font-weight:1000;

    letter-spacing:3px;
}

.section-title h2{
    margin-top:13px;

    font-size:clamp(32px,5vw,55px);
}

.section-title p{
    margin-top:14px;

    color:#817987;

    line-height:1.7;
}

/* =========================
   CARDS
========================= */

.cards{
    max-width:1150px;

    margin:auto;

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:18px;
}

.card{
    position:relative;

    padding:32px;

    border-radius:19px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.015)
        );

    border:1px solid rgba(255,255,255,.07);

    overflow:hidden;

    transition:.3s;
}

.card:before{
    content:"";

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:3px;

    background:linear-gradient(
        90deg,
        #8e51ff,
        #dd6cff
    );

    opacity:.8;
}

.card:hover{
    transform:translateY(-8px);

    border-color:rgba(221,108,255,.3);

    box-shadow:
        0 20px 60px rgba(0,0,0,.3);
}

.card-icon{
    font-size:32px;
    margin-bottom:20px;
}

.card h3{
    font-size:20px;
    margin-bottom:10px;
}

.card p{
    color:#817987;

    font-size:13px;

    line-height:1.7;
}

.card-button{
    display:inline-block;

    margin-top:20px;

    padding:10px 15px;

    border-radius:8px;

    color:#ddd6ff;

    background:rgba(142,81,255,.1);

    border:1px solid rgba(142,81,255,.2);

    font-size:11px;
    font-weight:900;

    transition:.2s;
}

.card-button:hover{
    background:#8e51ff;
    color:white;
}

/* =========================
   ESTADO
========================= */

.status-grid{
    max-width:1050px;

    margin:auto;

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:16px;
}

.status{
    padding:28px;

    text-align:center;

    border-radius:17px;

    background:rgba(255,255,255,.025);

    border:1px solid rgba(255,255,255,.07);
}

.status-icon{
    font-size:28px;
    margin-bottom:12px;
}

.status h3{
    font-size:15px;
    margin-bottom:7px;
}

.status p{
    color:#716a78;

    font-size:11px;
}

.online{
    color:#62ef91;
}

/* =========================
   CTA
========================= */

.cta{
    max-width:1100px;

    margin:auto;

    padding:80px 25px;

    text-align:center;

    border-radius:26px;

    background:
        radial-gradient(
            circle at center,
            rgba(142,81,255,.22),
            transparent 65%
        ),
        #0e0916;

    border:1px solid rgba(221,108,255,.15);

    box-shadow:
        0 30px 100px rgba(0,0,0,.35);
}

.cta h2{
    font-size:clamp(32px,5vw,52px);
}

.cta p{
    max-width:620px;

    margin:15px auto 25px;

    color:#817987;

    line-height:1.7;
}

/* =========================
   DISCORD
========================= */

.discord{
    max-width:1100px;

    margin:auto;

    display:grid;

    grid-template-columns:1.4fr .6fr;

    gap:18px;
}

.discord-main,
.discord-side{
    padding:40px;

    border-radius:20px;

    border:1px solid rgba(255,255,255,.07);
}

.discord-main{
    background:
        linear-gradient(
            135deg,
            rgba(142,81,255,.16),
            rgba(221,108,255,.04)
        );
}

.discord-side{
    background:rgba(255,255,255,.025);
}

.discord h2{
    font-size:32px;
    margin-bottom:12px;
}

.discord p{
    color:#817987;
    line-height:1.8;
}

.discord-side h3{
    margin-bottom:15px;
}

.discord-side p{
    font-size:13px;
    line-height:2;
}

/* =========================
   FOOTER
========================= */

footer{
    padding:55px 6%;

    border-top:1px solid rgba(255,255,255,.07);

    background:rgba(0,0,0,.25);
}

.footer{
    max-width:1150px;

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:30px;
}

.footer-logo{
    font-size:20px;
    font-weight:1000;

    background:linear-gradient(
        90deg,
        #fff,
        #ddd6ff,
        #dd6cff
    );

    -webkit-background-clip:text;
