<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Staff | THRASHMC NETWORK</title>

<meta name="description" content="Conoce al equipo oficial de THRASHMC NETWORK.">
<meta name="theme-color" content="#8e51ff">

<style>

/* =========================================================
   THRASHMC NETWORK
   STAFF.HTML
   HTML + CSS PURO
   ========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
    min-height:100%;
}

body{
    min-height:100vh;
    width:100%;
    overflow-x:hidden;
    overflow-y:auto;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(142,81,255,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(255,77,141,.15),
            transparent 30%
        ),
        #07050b;

    color:#ffffff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

/* =========================================================
   FONDO
   ========================================================= */

body::before{
    content:"";
    position:fixed;
    inset:0;

    pointer-events:none;

    opacity:.12;

    background-image:
        linear-gradient(
            rgba(255,255,255,.08) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.08) 1px,
            transparent 1px
        );

    background-size:40px 40px;

    z-index:-1;
}

/* =========================================================
   HEADER
   ========================================================= */

header{
    position:sticky;
    top:0;
    z-index:1000;

    width:100%;

    background:rgba(7,5,11,.94);

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    backdrop-filter:blur(18px);
}

.navbar{
    width:100%;
    max-width:1500px;

    min-height:80px;

    margin:auto;

    padding:
        15px
        25px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:25px;
}

.logo{
    color:#ffffff;

    text-decoration:none;

    font-size:26px;

    font-weight:1000;

    letter-spacing:1px;

    white-space:nowrap;
}

.logo span{
    color:#ff4d8d;
}

.navigation{
    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:7px;
}

.navigation a{
    color:#aaa5b2;

    text-decoration:none;

    font-size:14px;

    font-weight:700;

    padding:
        10px
        13px;

    border-radius:9px;

    transition:.25s;
}

.navigation a:hover{
    color:#ffffff;

    background:
        rgba(142,81,255,.16);

    transform:translateY(-2px);
}

.navigation a.active{
    color:#ffffff;

    background:
        linear-gradient(
            135deg,
            rgba(142,81,255,.25),
            rgba(255,77,141,.12)
        );

    box-shadow:
        0 0 20px
        rgba(142,81,255,.12);
}

/* =========================================================
   HERO
   ========================================================= */

.hero{
    width:100%;
    max-width:1200px;

    margin:auto;

    padding:
        105px
        20px
        70px;

    text-align:center;
}

.hero-badge{
    display:inline-block;

    padding:
        10px
        20px;

    border-radius:50px;

    color:#dfd5ff;

    background:
        rgba(142,81,255,.10);

    border:
        1px solid
        rgba(142,81,255,.45);

    font-size:13px;

    font-weight:800;

    letter-spacing:2px;
}

.hero h1{
    margin-top:25px;

    font-size:
        clamp(
            44px,
            8vw,
            88px
        );

    line-height:1;

    font-weight:1000;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #d9ccff,
            #8e51ff,
            #ff4d8d
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.hero p{
    max-width:800px;

    margin:
        28px
        auto
        0;

    color:#aaa5b2;

    font-size:19px;

    line-height:1.7;
}

.hero strong{
    color:#ffffff;
}

/* =========================================================
   STATS
   ========================================================= */

.stats{
    width:100%;
    max-width:1200px;

    margin:
        0
        auto
        90px;

    padding:
        0
        20px;

    display:grid;

    grid-template-columns:
        repeat(
            3,
            minmax(0,1fr)
        );

    gap:20px;
}

.stat{
    min-height:150px;

    padding:28px;

    text-align:center;

    border-radius:18px;

    background:
        rgba(18,14,25,.92);

    border:
        1px solid
        rgba(255,255,255,.08);

    transition:.25s;
}

.stat:hover{
    transform:translateY(-5px);

    border-color:
        rgba(142,81,255,.5);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.3);
}

.stat-icon{
    font-size:32px;

    margin-bottom:10px;
}

.stat-title{
    color:#77717f;

    font-size:12px;

    text-transform:uppercase;

    letter-spacing:1.5px;
}

.stat-value{
    margin-top:8px;

    color:#ffffff;

    font-size:24px;

    font-weight:1000;
}

/* =========================================================
   STAFF GRID
   ========================================================= */

.staff-grid{
    width:100%;
    max-width:1500px;

    margin:
        0
        auto;

    padding:
        0
        20px
        150px;

    display:grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:32px;

    align-items:stretch;
}

/* =========================================================
   STAFF CARD
   ========================================================= */

.staff-card{
    position:relative;

    width:100%;

    min-width:0;

    min-height:690px;

    height:auto;

    overflow:hidden;

    border-radius:24px;

    background:
        linear-gradient(
            145deg,
            rgba(28,20,40,.98),
            rgba(9,7,13,.98)
        );

    border:
        1px solid
        rgba(255,255,255,.09);

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.42);

    transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;
}

.staff-card:hover{
    transform:translateY(-7px);

    border-color:
        rgba(142,81,255,.55);

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.6),
        0 0 40px
        rgba(142,81,255,.12);
}

/* =========================================================
   BANNER
   ========================================================= */

.banner{
    position:relative;

    width:100%;

    height:235px;

    overflow:hidden;
}

.banner-owner{
    background:
        radial-gradient(
            circle at 15% 50%,
            rgba(255,77,141,.55),
            transparent 55%
        ),
        linear-gradient(
            135deg,
            #28101e,
            #100811
        );
}

.banner-admin{
    background:
        radial-gradient(
            circle at 15% 50%,
            rgba(255,80,80,.55),
            transparent 55%
        ),
        linear-gradient(
            135deg,
            #291010,
            #100808
        );
}

.banner-future{
    background:
        radial-gradient(
            circle at 15% 50%,
            rgba(142,81,255,.5),
            transparent 55%
        ),
        linear-gradient(
            135deg,
            #1d1128,
            #08060b
        );
}

/* =========================================================
   AVATAR
   ========================================================= */

.avatar{
    position:absolute;

    left:30px;
    bottom:-14px;

    width:120px;
    height:120px;

    overflow:hidden;

    border-radius:14px;

    background:#080808;

    border:
        4px solid
        #07050b;

    box-shadow:
        0 0 0 2px #8e51ff,
        0 0 30px
        rgba(142,81,255,.55);

    z-index:20;
}

.avatar img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    image-rendering:pixelated;
}

/* =========================================================
   PERSONA 3D
   ========================================================= */

.minecraft-body{
    position:absolute;

    right:30px;
    bottom:-65px;

    height:270px;

    width:auto;

    object-fit:contain;

    image-rendering:pixelated;

    filter:
        drop-shadow(
            0 15px 15px
            rgba(0,0,0,.8)
        );

    z-index:10;
}

/* =========================================================
   CONTENT
   ========================================================= */

.staff-content{
    width:100%;

    min-height:455px;

    height:auto;

    padding:
        75px
        30px
        35px;
}

.staff-name{
    font-size:27px;

    font-weight:1000;

    margin-bottom:11px;
}

.owner-name{
    color:#ff4d8d;
}

.admin-name{
    color:#ff6666;
}

.future-name{
    color:#c56cff;
}

.rank{
    display:inline-block;

    padding:
        8px
        14px;

    margin-bottom:20
