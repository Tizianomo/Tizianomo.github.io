<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Staff | THRASHMC NETWORK</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#07050a;
    --card:#120d17;
    --purple:#8e51ff;
    --pink:#ff4d8d;
    --white:#ffffff;
    --muted:#aaa3b1;
    --border:rgba(255,255,255,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    color:var(--white);
    font-family:'VT323',monospace;
    overflow-x:hidden;

    background:
        radial-gradient(
            circle at 15% 0%,
            rgba(142,81,255,.25),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 30%,
            rgba(255,77,141,.16),
            transparent 35%
        ),
        #07050a;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:32px 32px;
}


/* ========================================
   HEADER
======================================== */

.header{
    position:sticky;
    top:0;
    z-index:1000;

    background:rgba(7,5,10,.92);
    backdrop-filter:blur(18px);

    border-bottom:1px solid var(--border);
}

.nav{
    max-width:1400px;
    margin:auto;

    min-height:74px;
    padding:15px 30px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    text-decoration:none;
    color:white;

    font-family:'Press Start 2P',cursive;
    font-size:18px;

    text-shadow:
        0 0 20px rgba(142,81,255,.7);
}

.logo span{
    color:var(--pink);
}

.nav-links{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
}

.nav-links a{
    text-decoration:none;
    color:#aaa3b1;

    padding:10px 13px;

    border-radius:8px;

    font-size:16px;

    transition:.2s;
}

.nav-links a:hover,
.nav-links .active{
    color:white;

    background:
        linear-gradient(
            135deg,
            rgba(142,81,255,.22),
            rgba(255,77,141,.12)
        );

    box-shadow:
        0 0 20px rgba(142,81,255,.12);
}


/* ========================================
   HERO
======================================== */

.hero{
    max-width:1200px;
    margin:auto;

    padding:110px 25px 70px;

    text-align:center;
}

.badge{
    display:inline-block;

    padding:9px 18px;

    border-radius:50px;

    color:#ddd6ff;

    background:rgba(142,81,255,.1);

    border:1px solid rgba(142,81,255,.35);

    letter-spacing:2px;

    font-size:14px;
}

.hero h1{
    margin-top:28px;

    font-family:'Press Start 2P',cursive;

    font-size:clamp(32px,7vw,72px);

    line-height:1.2;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #ddd6ff,
            #8e51ff,
            #ff4d8d
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.hero p{
    max-width:700px;

    margin:25px auto 0;

    color:var(--muted);

    font-size:23px;

    line-height:1.4;
}


/* ========================================
   STATS
======================================== */

.stats{
    max-width:1100px;

    margin:0 auto 70px;

    padding:0 20px;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:16px;
}

.stat{
    padding:25px;

    text-align:center;

    background:rgba(20,15,25,.9);

    border:1px solid var(--border);

    border-radius:16px;

    transition:.25s;
}

.stat:hover{
    transform:translateY(-5px);

    border-color:
        rgba(142,81,255,.45);

    box-shadow:
        0 15px 40px rgba(0,0,0,.35);
}

.stat-icon{
    font-size:30px;

    margin-bottom:10px;
}

.stat-title{
    color:#77707f;

    font-size:15px;

    text-transform:uppercase;
}

.stat-value{
    margin-top:5px;

    font-size:25px;

    font-weight:bold;
}


/* ========================================
   STAFF GRID
======================================== */

.staff-grid{
    max-width:1400px;

    margin:auto;

    padding:0 25px 110px;

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(330px,1fr)
        );

    gap:25px;
}

.staff-card{
    position:relative;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            rgba(25,19,31,.98),
            rgba(10,8,13,.98)
        );

    border:1px solid var(--border);

    border-radius:20px;

    transition:.3s;

    box-shadow:
        0 20px 60px rgba(0,0,0,.35);
}

.staff-card:hover{
    transform:translateY(-8px);

    border-color:
        rgba(142,81,255,.55);

    box-shadow:
        0 25px 70px rgba(0,0,0,.55),
        0 0 35px rgba(142,81,255,.12);
}


/* ========================================
   BANNERS
======================================== */

.banner{
    height:180px;

    position:relative;

    overflow:hidden;
}

.owner-banner{
    background:
        radial-gradient(
            circle at 25% 50%,
            rgba(255,77,141,.5),
            transparent 55%
        ),
        linear-gradient(
            135deg,
            #21101b,
            #100914
        );
}

.admin-banner{
    background:
        radial-gradient(
            circle at 25% 50%,
            rgba(255,85,85,.5),
            transparent 55%
        ),
        linear-gradient(
            135deg,
            #211010,
            #100909
        );
}

.future-banner{
    background:
        radial-gradient(
            circle at 25% 50%,
            rgba(142,81,255,.35),
            transparent 55%
        ),
        linear-gradient(
            135deg,
            #171020,
            #0b080e
        );
}

.banner::before{
    content:"";

    position:absolute;

    width:400px;
    height:400px;

    top:-220px;
    right:-100px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.08),
            transparent 65%
        );
}


/* ========================================
   MINECRAFT AVATAR
======================================== */

.avatar{
    position:absolute;

    z-index:5;

    left:25px;
    top:105px;

    width:105px;
    height:105px;

    padding:4px;

    background:#08060b;

    border-radius:12px;

    border:3px solid var(--purple);

    box-shadow:
        0 0 25px rgba(142,81,255,.4);

    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;

    object-fit:cover;

    image-rendering:pixelated;
}


/* ========================================
   MINECRAFT BODY
======================================== */

.body-skin{
    position:absolute;

    z-index:4;

    right:20px;
    bottom:-40px;

    height:220px;

    image-rendering:pixelated;

    filter:
        drop-shadow(
            0 10px 12px rgba(0,0,0,.7)
        );
}


/* ========================================
   CONTENT
======================================== */

.content{
    padding:65px 25px 25px;
}

.name{
    font-family:'Press Start 2P',cursive;

    font-size:17px;

    margin-bottom:12px;
}

.rank{
    display:inline-block;

    padding:7px 12px;

    border-radius:6px;

    font-size:15px;

    font-weight:bold;

    margin-bottom:16px;
}

.owner{
    color:#ff4d8d;

    background:
        rgba(255,77,141,.09
